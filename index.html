<!DOCTYPE html>
<html lang="ro">

<head>

    <!-- ===== SETARI GENERALE ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PONTAJ</title>

    <!-- ===== INSTALARE APLICATIE ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- ===== ICON APLICATIE ===== -->
    <link rel="icon" href="icon-192.png">

    <!-- ===== FISIER CSS ===== -->
    <link rel="stylesheet" href="style.css">

    <!-- ===== SUPABASE LIBRARY ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <!-- ===== CONTAINER PRINCIPAL ===== -->
    <div class="desktop-wrapper">

        <!-- ===== SIMULARE TELEFON ===== -->
        <div class="phone-frame">

            <!-- ===== ECRAN APLICATIE ===== -->
            <div class="app-screen">

                <!-- ===== TITLU APLICATIE ===== -->
                <div class="header-title">
                    PONTAJ
                </div>

                <!-- ===== LOGIN ===== -->
                <div class="main-menu">

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        class="login-input"
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Parola"
                        class="login-input"
                    >

                    <button
                        class="menu-card"
                        onclick="loginUser()"
                    >
                        LOGIN
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ===== CONECTARE SUPABASE ===== -->
    <script>

        const SUPABASE_URL = "https://xnkvrbccegzpzkbmbnwq.supabase.co";

        const SUPABASE_KEY = "sb_publishable_K9GYHHRPeKadCipve58aKA_JGoPzTy_";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        // ===== LOGIN USER =====
        async function loginUser() {

            const email = document.getElementById("email").value;

            const password = document.getElementById("password").value;

            const { error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {

                alert("Email sau parola gresita");

                return;

            }

            alert("Login reusit");

        }

    </script>

</body>

</html>
