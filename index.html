<!DOCTYPE html>
<html lang="ro">

<head>

    <!-- ===== SETARI GENERALE ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PONTAJ</title>

    <!-- ===== INSTALARE APLICATIE ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- ===== ICON APLICATIE ===== -->
    <link rel="icon" href="icon-192.png">

    <!-- ===== FISIER CSS ===== -->
    <link rel="stylesheet" href="style.css">

    <!-- ===== SUPABASE LIBRARY ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ===== CITIRE FISIERE EXCEL ===== -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- ===== GRAFICA MESAJE ===== -->
    <style>

        .custom-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            width: 320px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 9999;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
            display: none;
        }

        .custom-message-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .custom-message-text {
            font-size: 24px;
            font-weight: bold;
        }

        .success-text {
            color: green;
        }

        .error-text {
            color: red;
        }

        .message-button {
            margin-top: 25px;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }

        .success-button {
            background: green;
        }

        .error-button {
            background: red;
        }

        .user-info {
            color: #d4af37;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .excel-preview {
            width: 92%;
            max-height: 180px;
            overflow: auto;
            background: #ffffff;
            color: #111111;
            border-radius: 12px;
            padding: 8px;
            font-size: 11px;
            display: none;
        }

        .excel-preview table {
            border-collapse: collapse;
            width: 100%;
        }

        .excel-preview td {
            border: 1px solid #cccccc;
            padding: 4px;
            white-space: nowrap;
        }

        .excel-preview-title {
            color: #d4af37;
            font-size: 14px;
            font-weight: bold;
            display: none;
            margin-top: 8px;
        }

    </style>

</head>

<body>

    <!-- ===== CONTAINER PRINCIPAL ===== -->
    <div class="desktop-wrapper">

        <!-- ===== SIMULARE TELEFON ===== -->
        <div class="phone-frame">

            <!-- ===== ECRAN APLICATIE ===== -->
            <div class="app-screen">

                <!-- ===== TITLU APLICATIE ===== -->
                <div class="header-title">
                    PONTAJ
                </div>

                <!-- ===== LOGIN ===== -->
                <div
                    class="main-menu"
                    id="login-box"
                >

                    <input
                        type="text"
                        id="nume"
                        placeholder="Nume utilizator"
                        class="login-input"
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Parola"
                        class="login-input"
                    >

                    <input
                        type="password"
                        id="password2"
                        placeholder="Repeta parola"
                        class="login-input"
                        style="display:none;"
                    >

                    <button
                        class="menu-card"
                        onclick="loginUser()"
                    >
                        LOGIN
                    </button>

                </div>

                <!-- ===== MENIU PRINCIPAL ===== -->
                <div
                    class="main-menu"
                    id="main-menu"
                    style="display:none;"
                >

                    <div
                        class="user-info"
                        id="user-info"
                    >
                    </div>

                    <div class="menu-card">
                        Angajati
                    </div>

                    <div class="menu-card">
                        Raport luna curenta
                    </div>

                    <div class="menu-card">
                        Rapoarte
                    </div>

                    <!-- ===== IMPORT PONTAJ ===== -->
                    <div
                        class="menu-card"
                        onclick="document.getElementById('fisier-pontaj').click()"
                    >
                        Import pontaj
                    </div>

                    <!-- ===== SELECTOR FISIER PONTAJ ===== -->
                    <input
                        type="file"
                        id="fisier-pontaj"
                        accept=".xls,.xlsx"
                        style="display:none;"
                        onchange="selecteazaFisier()"
                    >

                    <!-- ===== PREVIZUALIZARE FISIER EXCEL ===== -->
                    <div
                        class="excel-preview-title"
                        id="excel-preview-title"
                    >
                        Primele randuri citite
                    </div>

                    <div
                        class="excel-preview"
                        id="excel-preview"
                    >
                    </div>

                    <button
                        class="menu-card"
                        onclick="logoutUser()"
                    >
                        LOGOUT
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ===== CASETA MESAJE ===== -->
    <div
        class="custom-message"
        id="custom-message"
    >

        <div
            class="custom-message-icon"
            id="message-icon"
        >
        </div>

        <div
            class="custom-message-text"
            id="message-text"
        >
        </div>

        <button
            class="message-button"
            id="message-button"
            onclick="closeMessage()"
        >
            OK
        </button>

    </div>

    <!-- ===== CONECTARE SUPABASE ===== -->
    <script>

        const SUPABASE_URL = "https://xnkvrbccegzpzkbmbnwq.supabase.co";

        const SUPABASE_KEY = "sb_publishable_K9GYHHRPeKadCipve58aKA_JGoPzTy_";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        // ===== DATE UTILIZATOR LOGAT =====
        let utilizatorLogat = null;

        // ===== AFISARE MESAJ =====
        function showMessage(text, type) {

            const box = document.getElementById("custom-message");

            const messageText = document.getElementById("message-text");

            const icon = document.getElementById("message-icon");

            const button = document.getElementById("message-button");

            box.style.display = "block";

            messageText.innerHTML = text;

            if (type === "success") {

                icon.innerHTML = "✔";

                messageText.className = "custom-message-text success-text";

                button.className = "message-button success-button";

            } else {

                icon.innerHTML = "✖";

                messageText.className = "custom-message-text error-text";

                button.className = "message-button error-button";

            }

        }

        // ===== INCHIDERE MESAJ =====
        function closeMessage() {

            document.getElementById("custom-message").style.display = "none";

        }

        // ===== AFISARE MENIU PRINCIPAL =====
        function showMainMenu(userData) {

            utilizatorLogat = userData;

            localStorage.setItem(
                "utilizatorLogat",
                JSON.stringify(userData)
            );

            document.getElementById("login-box").style.display = "none";

            document.getElementById("main-menu").style.display = "flex";

            document.getElementById("user-info").innerHTML =
                userData.nume + "<br>" + userData.acces;

        }

        // ===== LOGIN USER =====
        async function loginUser() {

            const nume = document.getElementById("nume").value;

            const password = document.getElementById("password").value;

            const password2 = document.getElementById("password2").value;

            const { data, error } = await supabaseClient
                .from("utilizatori")
                .select("*")
                .eq("nume", nume)
                .single();

            if (error || !data) {

                showMessage(
                    "Utilizator inexistent",
                    "error"
                );

                return;

            }

            // ===== PRIMA LOGARE =====
            if (!data.parola || data.parola === "") {

                document.getElementById("password2").style.display = "block";

                if (password2 === "") {

                    showMessage(
                        "Repeta parola",
                        "error"
                    );

                    return;

                }

                if (password !== password2) {

                    showMessage(
                        "Parole diferite",
                        "error"
                    );

                    return;

                }

                const { error: saveError } = await supabaseClient
                    .from("utilizatori")
                    .update({
                        parola: password
                    })
                    .eq("id", data.id);

                if (saveError) {

                    showMessage(
                        "Eroare salvare parola",
                        "error"
                    );

                    return;

                }

                showMainMenu(data);

                showMessage(
                    "Parola salvata",
                    "success"
                );

                return;

            }

            // ===== LOGIN NORMAL =====
            if (data.parola !== password) {

                showMessage(
                    "Parola gresita",
                    "error"
                );

                return;

            }

            showMainMenu(data);

            showMessage(
                "Login reusit",
                "success"
            );

        }

        // ===== VERIFICARE SESIUNE =====
        function checkSession() {

            const userSalvat = localStorage.getItem("utilizatorLogat");

            if (userSalvat) {

                const userData = JSON.parse(userSalvat);

                showMainMenu(userData);

            }

        }

        // ===== LOGOUT =====
        function logoutUser() {

            utilizatorLogat = null;

            localStorage.removeItem("utilizatorLogat");

            location.reload();

        }

        // ===== SELECTARE SI CITIRE FISIER PONTAJ =====
        function selecteazaFisier() {

            const fisier = document.getElementById("fisier-pontaj").files[0];

            if (!fisier) {

                return;

            }

            const reader = new FileReader();

            reader.onload = function(event) {

                try {

                    const dateFisier = new Uint8Array(event.target.result);

                    const workbook = XLSX.read(dateFisier, {
                        type: "array"
                    });

                    const primaFoaie = workbook.SheetNames[0];

                    const worksheet = workbook.Sheets[primaFoaie];

                    const randuri = XLSX.utils.sheet_to_json(worksheet, {
                        header: 1,
                        defval: ""
                    });

                    afiseazaPrimeleRanduri(randuri);

                    showMessage(
                        "Fisier citit: " + fisier.name,
                        "success"
                    );

                } catch (error) {

                    showMessage(
                        "Fisierul nu a putut fi citit",
                        "error"
                    );

                }

            };

            reader.readAsArrayBuffer(fisier);

        }

        // ===== AFISARE PRIMELE RANDURI DIN EXCEL =====
        function afiseazaPrimeleRanduri(randuri) {

            const preview = document.getElementById("excel-preview");

            const titlu = document.getElementById("excel-preview-title");

            const primeleRanduri = randuri.slice(0, 10);

            let tabel = "<table>";

            primeleRanduri.forEach(function(rand) {

                tabel += "<tr>";

                rand.forEach(function(celula) {

                    tabel += "<td>" + celula + "</td>";

                });

                tabel += "</tr>";

            });

            tabel += "</table>";

            preview.innerHTML = tabel;

            preview.style.display = "block";

            titlu.style.display = "block";

        }

        checkSession();

    </script>

</body>

</html>
