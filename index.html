<!DOCTYPE html>
<html lang="ro">

<head>

    <!-- ===== SETARI GENERALE ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PONTAJ</title>

    <!-- ===== INSTALARE APLICATIE ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- ===== ICON APLICATIE ===== -->
    <link rel="icon" href="icon-192.png">

    <!-- ===== FISIER CSS ===== -->
    <link rel="stylesheet" href="style.css">

    <!-- ===== SUPABASE LIBRARY ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ===== CITIRE FISIERE EXCEL ===== -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- ===== GRAFICA MESAJE ===== -->
    <style>

        .custom-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            width: 320px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 9999;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
            display: none;
        }

        .custom-message-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .custom-message-text {
            font-size: 24px;
            font-weight: bold;
        }

        .success-text {
            color: green;
        }

        .error-text {
            color: red;
        }

        .message-button {
            margin-top: 25px;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }

        .success-button {
            background: green;
        }

        .error-button {
            background: red;
        }

        .user-info {
            color: #d4af37;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .excel-preview {
            width: 92%;
            max-height: 180px;
            overflow: auto;
            background: #ffffff;
            color: #111111;
            border-radius: 12px;
            padding: 8px;
            font-size: 11px;
            display: none;
        }

        .excel-preview table {
            border-collapse: collapse;
            width: 100%;
        }

        .excel-preview td {
            border: 1px solid #cccccc;
            padding: 4px;
            white-space: nowrap;
        }

        .excel-preview-title {
            color: #d4af37;
            font-size: 14px;
            font-weight: bold;
            display: none;
            margin-top: 8px;
        }

        .password-wrap {
            position: relative;
            width: 100%;
        }

        .password-wrap .login-input {
            width: 100%;
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            color: #d4af37;
            user-select: none;
        }

        .raport-angajat {
            font-weight: bold;
            color: #111111;
            margin-top: 8px;
            margin-bottom: 3px;
        }

        .raport-zile {
            font-size: 11px;
            color: #333333;
            margin-bottom: 6px;
            border-bottom: 1px solid #dddddd;
            padding-bottom: 5px;
        }

    </style>

</head>

<body>

    <!-- ===== CONTAINER PRINCIPAL ===== -->
    <div class="desktop-wrapper">

        <!-- ===== SIMULARE TELEFON ===== -->
        <div class="phone-frame">

            <!-- ===== ECRAN APLICATIE ===== -->
            <div class="app-screen">

                <!-- ===== TITLU APLICATIE ===== -->
                <div class="premium-header">
                    <div class="premium-header-icon">⌚</div>
                    <div class="header-title">PONTAJ</div>
                    <div class="premium-header-icon">👤</div>
                </div>

                <div class="premium-line"></div>

                <!-- ===== LOGIN ===== -->
                <div
                    class="main-menu"
                    id="login-box"
                >

                    <input
                        type="text"
                        id="nume"
                        placeholder="Nume utilizator"
                        class="login-input"
                    >

                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            placeholder="Parola"
                            class="login-input"
                        >
                        <span
                            class="password-toggle"
                            onclick="togglePassword('password', this)"
                        >👁</span>
                    </div>

                    <div
                        class="password-wrap"
                        id="password2-wrap"
                        style="display:none;"
                    >
                        <input
                            type="password"
                            id="password2"
                            placeholder="Repeta parola"
                            class="login-input"
                        >
                        <span
                            class="password-toggle"
                            onclick="togglePassword('password2', this)"
                        >👁</span>
                    </div>

                    <button
                        class="menu-card"
                        onclick="loginUser()"
                    >
                        LOGIN
                    </button>

                </div>

                <!-- ===== MENIU PRINCIPAL ===== -->
                <div
                    class="main-menu"
                    id="main-menu"
                    style="display:none;"
                >

                    <!-- ===== CARD UTILIZATOR ===== -->
                    <div class="user-card">
                        <div class="user-avatar" id="user-avatar">MF</div>
                        <div class="user-separator"></div>
                        <div
                            class="user-info"
                            id="user-info"
                        >
                        </div>
                    </div>

                    <div class="menu-card">
                        <span class="menu-icon">👥</span>
                        <span class="menu-text">Angajati</span>
                        <span class="menu-arrow">›</span>
                    </div>

                    <div class="menu-card">
                        <span class="menu-icon">📅</span>
                        <span class="menu-text">Raport luna curenta</span>
                        <span class="menu-arrow">›</span>
                    </div>

                    <div
                        class="menu-card"
                        onclick="afiseazaRaportZileFaraPontaj()"
                    >
                        <span class="menu-icon">📊</span>
                        <span class="menu-text">Rapoarte</span>
                        <span class="menu-arrow">›</span>
                    </div>

                    <!-- ===== IMPORT PONTAJ ===== -->
                    <div
                        class="menu-card"
                        onclick="document.getElementById('fisier-pontaj').click()"
                    >
                        <span class="menu-icon">☁</span>
                        <span class="menu-text">Import pontaj</span>
                        <span class="menu-arrow">›</span>
                    </div>

                    <!-- ===== SELECTOR FISIER PONTAJ ===== -->
                    <input
                        type="file"
                        id="fisier-pontaj"
                        accept=".xls,.xlsx"
                        style="display:none;"
                        onchange="selecteazaFisier()"
                    >

                    <!-- ===== PREVIZUALIZARE FISIER EXCEL ===== -->
                    <div
                        class="excel-preview-title"
                        id="excel-preview-title"
                    >
                        Primele randuri citite
                    </div>

                    <div
                        class="excel-preview"
                        id="excel-preview"
                    >
                    </div>

                    <!-- ===== RAPORT TEST ZILE FARA PONTAJ ===== -->
                    <div
                        class="excel-preview-title"
                        id="raport-zile-title"
                    >
                        Zile fara pontaj Luni - Vineri
                    </div>

                    <div
                        class="excel-preview"
                        id="raport-zile-box"
                    >
                    </div>

                    <button
                        class="menu-card logout-card"
                        onclick="logoutUser()"
                    >
                        <span class="menu-icon">↪</span>
                        <span class="menu-text">LOGOUT</span>
                        <span class="menu-arrow">›</span>
                    </button>

                    <div class="secure-footer">🛡 Sesiune securizata</div>

                </div>

            </div>

        </div>

    </div>

    <!-- ===== CASETA MESAJE ===== -->
    <div
        class="custom-message"
        id="custom-message"
    >

        <div
            class="custom-message-icon"
            id="message-icon"
        >
        </div>

        <div
            class="custom-message-text"
            id="message-text"
        >
        </div>

        <button
            class="message-button"
            id="message-button"
            onclick="closeMessage()"
        >
            OK
        </button>

    </div>

    <!-- ===== CONECTARE SUPABASE ===== -->
    <script>

        const SUPABASE_URL = "https://xnkvrbccegzpzkbmbnwq.supabase.co";

        const SUPABASE_KEY = "sb_publishable_K9GYHHRPeKadCipve58aKA_JGoPzTy_";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        // ===== DATE UTILIZATOR LOGAT =====
        let utilizatorLogat = null;

        // ===== DATE ULTIM IMPORT PENTRU RAPOARTE TEST =====
        let ultimImportRanduri = [];

        // ===== AFISARE MESAJ =====
        function showMessage(text, type) {

            const box = document.getElementById("custom-message");

            const messageText = document.getElementById("message-text");

            const icon = document.getElementById("message-icon");

            const button = document.getElementById("message-button");

            box.style.display = "block";

            messageText.innerHTML = text;

            if (type === "success") {

                icon.innerHTML = "✔";

                messageText.className = "custom-message-text success-text";

                button.className = "message-button success-button";

            } else {

                icon.innerHTML = "✖";

                messageText.className = "custom-message-text error-text";

                button.className = "message-button error-button";

            }

        }

        // ===== INCHIDERE MESAJ =====
        function closeMessage() {

            document.getElementById("custom-message").style.display = "none";

        }

        // ===== AFISARE MENIU PRINCIPAL =====
        function showMainMenu(userData) {

            utilizatorLogat = userData;

            localStorage.setItem(
                "utilizatorLogat",
                JSON.stringify(userData)
            );

            document.getElementById("login-box").style.display = "none";

            document.getElementById("main-menu").style.display = "flex";

            document.getElementById("user-info").innerHTML =
                userData.nume + "<br>" + userData.acces;

            const partiNume = userData.nume.trim().split(" ");
            const initiale = partiNume
                .map(function(parte) {
                    return parte.charAt(0);
                })
                .join("")
                .substring(0, 2)
                .toUpperCase();

            document.getElementById("user-avatar").innerHTML = initiale;

        }


        // ===== AFISARE / ASCUNDERE PAROLA =====
        function togglePassword(inputId, icon) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                icon.innerHTML = "🙈";

            } else {

                input.type = "password";

                icon.innerHTML = "👁";

            }

        }

        // ===== LOGIN USER =====
        async function loginUser() {

            const nume = document.getElementById("nume").value;

            const password = document.getElementById("password").value;

            const password2 = document.getElementById("password2").value;

            const { data, error } = await supabaseClient
                .from("utilizatori")
                .select("*")
                .eq("nume", nume)
                .single();

            if (error || !data) {

                showMessage(
                    "Utilizator inexistent",
                    "error"
                );

                return;

            }

            // ===== PRIMA LOGARE =====
            if (!data.parola || data.parola === "") {

                document.getElementById("password2-wrap").style.display = "block";

                if (password2 === "") {

                    showMessage(
                        "Repeta parola",
                        "error"
                    );

                    return;

                }

                if (password !== password2) {

                    showMessage(
                        "Parole diferite",
                        "error"
                    );

                    return;

                }

                const { error: saveError } = await supabaseClient
                    .from("utilizatori")
                    .update({
                        parola: password
                    })
                    .eq("id", data.id);

                if (saveError) {

                    showMessage(
                        "Eroare salvare parola",
                        "error"
                    );

                    return;

                }

                showMainMenu(data);

                showMessage(
                    "Parola salvata",
                    "success"
                );

                return;

            }

            // ===== LOGIN NORMAL =====
            if (data.parola !== password) {

                showMessage(
                    "Parola gresita",
                    "error"
                );

                return;

            }

            showMainMenu(data);

            showMessage(
                "Login reusit",
                "success"
            );

        }

        // ===== VERIFICARE SESIUNE =====
        function checkSession() {

            const userSalvat = localStorage.getItem("utilizatorLogat");

            if (userSalvat) {

                const userData = JSON.parse(userSalvat);

                showMainMenu(userData);

            }

        }

        // ===== LOGOUT =====
        function logoutUser() {

            utilizatorLogat = null;

            localStorage.removeItem("utilizatorLogat");

            location.reload();

        }

        // ===== SELECTARE SI CITIRE FISIER PONTAJ =====
        function selecteazaFisier() {

            const fisier = document.getElementById("fisier-pontaj").files[0];

            if (!fisier) {

                return;

            }

            const reader = new FileReader();

            reader.onload = async function(event) {

                try {

                    const dateFisier = new Uint8Array(event.target.result);

                    const workbook = XLSX.read(dateFisier, {
                        type: "array"
                    });

                    const primaFoaie = workbook.SheetNames[0];

                    const worksheet = workbook.Sheets[primaFoaie];

                    const randuri = XLSX.utils.sheet_to_json(worksheet, {
                        header: 1,
                        defval: ""
                    });

                    afiseazaPrimeleRanduri(randuri);

                    ultimImportRanduri = randuri;

                    await salveazaPontajZilnic(randuri);

                    showMessage(
                        "Fisier citit: " + fisier.name,
                        "success"
                    );

                } catch (error) {

                    showMessage(
                        "Fisierul nu a putut fi citit",
                        "error"
                    );

                }

            };

            reader.readAsArrayBuffer(fisier);

        }

        // ===== AFISARE PRIMELE RANDURI DIN EXCEL =====
        function afiseazaPrimeleRanduri(randuri) {

            const preview = document.getElementById("excel-preview");

            const titlu = document.getElementById("excel-preview-title");

            const primeleRanduri = randuri.slice(0, 10);

            let tabel = "<table>";

            primeleRanduri.forEach(function(rand) {

                tabel += "<tr>";

                rand.forEach(function(celula) {

                    tabel += "<td>" + celula + "</td>";

                });

                tabel += "</tr>";

            });

            tabel += "</table>";

            preview.innerHTML = tabel;

            preview.style.display = "block";

            titlu.style.display = "block";

        }



        // ===== SALVARE PONTAJ ZILNIC IN SUPABASE =====
        async function salveazaPontajZilnic(randuri) {

            try {

                const grupare = {};

                for (let i = 1; i < randuri.length; i++) {

                    const rand = randuri[i];

                    const nume = String(rand[3] || "").trim();
                    const departament = String(rand[4] || "").trim();
                    const dataOraRaw = rand[5];

                    // ===== EXCLUDERE ANGAJATI =====
                    if (
                        nume === "VOLINTIRU ANA MARIA" ||
                        nume === "VOLINTIRU MIHAIL"
                    ) {
                        continue;
                    }

                    if (!nume || !dataOraRaw) {
                        continue;
                    }

                    const dateInfo = convertesteDataOraExcel(dataOraRaw);

                    if (!dateInfo) {
                        continue;
                    }

                    const cheie = nume + "|" + dateInfo.data;

                    if (!grupare[cheie]) {

                        grupare[cheie] = {
                            nume: nume,
                            departament: departament,
                            data: dateInfo.data,
                            pontari: []
                        };

                    }

                    grupare[cheie].pontari.push(dateInfo);

                }

                const rezultate = Object.values(grupare).map(function(grup) {

                    grup.pontari.sort(function(a, b) {
                        return a.minute - b.minute;
                    });

                    const primaPontare = grup.pontari[0];
                    const ultimaPontare = grup.pontari[grup.pontari.length - 1];

                    return {
                        nume: grup.nume,
                        departament: grup.departament,
                        data: grup.data,
                        ora_intrare: primaPontare.ora,
                        ora_iesire: ultimaPontare.ora,
                        nr_pontari: grup.pontari.length
                    };

                });

                console.log("REZULTATE:", rezultate);

                const { data, error } = await supabaseClient
                    .from("pontaj_zilnic")
                    .upsert(

                        rezultate.map(function(pontaj) {

                            return {

                                nume: pontaj.nume,
                                departament: pontaj.departament,
                                data: pontaj.data,
                                ora_intrare: pontaj.ora_intrare,
                                ora_iesire: pontaj.ora_iesire,
                                nr_pontari: pontaj.nr_pontari,
                                importat_de: utilizatorLogat?.nume || "",
                                cheie_unica:
                                    pontaj.nume + "|" + pontaj.data

                            };

                        }),

                        {
                            onConflict: "cheie_unica"
                        }

                    );

                console.log("SUPABASE DATA:", data);
                console.log("SUPABASE ERROR:", error);

                if (error) {

                    showMessage(
                        "Eroare salvare Supabase",
                        "error"
                    );

                    return;

                }

                showMessage(
                    "Import salvat in Supabase",
                    "success"
                );

            } catch(err) {

                console.log(err);

                showMessage(
                    "Eroare import",
                    "error"
                );

            }

        }

        // ===== CONVERSIE DATA SI ORA EXCEL =====
        function convertesteDataOraExcel(valoare) {

            const text = String(valoare).trim();

            const parti = text.split(" ");

            if (parti.length < 3) {
                return null;
            }

            const dataText = parti[0];
            const oraText = parti[1];
            const ampm = parti[2].toUpperCase();

            const dataParti = dataText.split("/");

            if (dataParti.length !== 3) {
                return null;
            }

            const luna = dataParti[0].padStart(2, "0");
            const zi = dataParti[1].padStart(2, "0");
            const an = dataParti[2];

            const oraParti = oraText.split(":");

            if (oraParti.length < 2) {
                return null;
            }

            let ora = parseInt(oraParti[0], 10);
            const minut = parseInt(oraParti[1], 10);

            if (ampm === "PM" && ora !== 12) {
                ora += 12;
            }

            if (ampm === "AM" && ora === 12) {
                ora = 0;
            }

            const minuteTotale = ora * 60 + minut;

            return {
                data: an + "-" + luna + "-" + zi,
                ora: String(ora).padStart(2, "0") + ":" + String(minut).padStart(2, "0"),
                minute: minuteTotale
            };

        }




        // ===== RAPORT TEST: ZILE FARA PONTAJ LUNI - VINERI =====
        function afiseazaRaportZileFaraPontaj() {

            const box = document.getElementById("raport-zile-box");
            const titlu = document.getElementById("raport-zile-title");

            if (!ultimImportRanduri || ultimImportRanduri.length <= 1) {

                showMessage(
                    "Nu exista import pentru raport",
                    "error"
                );

                return;

            }

            const angajati = {};
            const pontaje = {};
            let dataMinima = null;
            let dataMaxima = null;

            for (let i = 1; i < ultimImportRanduri.length; i++) {

                const rand = ultimImportRanduri[i];

                const nume = String(rand[3] || "").trim();
                const dataOraRaw = rand[5];

                if (
                    !nume ||
                    !dataOraRaw ||
                    nume === "VOLINTIRU ANA MARIA" ||
                    nume === "VOLINTIRU MIHAIL"
                ) {
                    continue;
                }

                const dateInfo = convertesteDataOraExcel(dataOraRaw);

                if (!dateInfo) {
                    continue;
                }

                angajati[nume] = true;
                pontaje[nume + "|" + dateInfo.data] = true;

                const dataObj = creeazaDataDinText(dateInfo.data);

                if (!dataMinima || dataObj < dataMinima) {
                    dataMinima = dataObj;
                }

                if (!dataMaxima || dataObj > dataMaxima) {
                    dataMaxima = dataObj;
                }

            }

            const listaAngajati = Object.keys(angajati).sort(function(a, b) {
                return a.localeCompare(b, "ro");
            });

            let html = "";

            listaAngajati.forEach(function(nume) {

                const zileLipsa = [];
                const dataCurenta = new Date(dataMinima);

                while (dataCurenta <= dataMaxima) {

                    const ziSaptamana = dataCurenta.getDay();

                    if (ziSaptamana >= 1 && ziSaptamana <= 5) {

                        const dataText = formatDataPentruCheie(dataCurenta);

                        if (!pontaje[nume + "|" + dataText]) {
                            zileLipsa.push(formatDataAfisare(dataCurenta));
                        }

                    }

                    dataCurenta.setDate(dataCurenta.getDate() + 1);

                }

                if (zileLipsa.length > 0) {

                    html += "<div class='raport-angajat'>" + nume + "</div>";
                    html += "<div class='raport-zile'>" + zileLipsa.join(", ") + "</div>";

                }

            });

            if (html === "") {
                html = "Nu exista zile fara pontaj in perioada importata.";
            }

            box.innerHTML = html;
            box.style.display = "block";
            titlu.style.display = "block";

        }

        // ===== DATA DIN TEXT YYYY-MM-DD =====
        function creeazaDataDinText(dataText) {

            const parti = dataText.split("-");

            return new Date(
                parseInt(parti[0], 10),
                parseInt(parti[1], 10) - 1,
                parseInt(parti[2], 10)
            );

        }

        // ===== FORMATARE DATA PENTRU CHEIE =====
        function formatDataPentruCheie(dataObj) {

            const an = dataObj.getFullYear();
            const luna = String(dataObj.getMonth() + 1).padStart(2, "0");
            const zi = String(dataObj.getDate()).padStart(2, "0");

            return an + "-" + luna + "-" + zi;

        }

        // ===== FORMATARE DATA PENTRU AFISARE =====
        function formatDataAfisare(dataObj) {

            const zi = String(dataObj.getDate()).padStart(2, "0");
            const luna = String(dataObj.getMonth() + 1).padStart(2, "0");

            return zi + "." + luna;

        }



        checkSession();

    </script>

</body>

</html>
